<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Registramos Nuestras Ventas | CEBE</title>
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.documentElement.innerHTML = '<body style="background:#e3f2fd; color:#1565c0; padding: 40px; font-family:sans-serif; text-align:center;"><h1>🚨 ERROR EN EL CÓDIGO 🚨</h1><p style="font-size:24px;">' + msg + '</p></body>';
            return false;
        };
    </script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { 
            margin: 0; width: 100vw; height: 100vh; 
            background: linear-gradient(135deg, #e3f2fd 0%, #90caf9 100%); 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: manipulation; 
        }
        
        .game-container { 
            width: 98vw; height: 96vh; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.2), inset 0 0 0 10px #1e88e5; 
            padding: 20px 30px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            position: relative;
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #bbdefb; padding: 12px 30px; border-radius: 40px; border: 5px solid #42a5f5; z-index: 100; }
        .cebe-title-container { display: flex; align-items: center; gap: 15px; }
        .cebe-logo-circle { width: 65px; height: 65px; background: #1565c0; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 1.6rem; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .cebe-title-text { font-size: 2rem; font-weight: bold; color: #0d47a1; text-align: center; }
        
        .right-controls { display: flex; align-items: center; gap: 15px; }
        .student-name { background: #1e88e5; border-radius: 40px; padding: 10px 25px; font-size: 1.8rem; font-weight: bold; color: white; text-align: center; box-shadow: 0 5px 0 #1565c0; min-width: 150px; }
        .music-toggle { background: #ffca28; border: none; font-size: 2.2rem; border-radius: 50%; width: 60px; height: 60px; cursor: pointer; color: white; box-shadow: 0 6px 0 #ff8f00; display:flex; align-items:center; justify-content:center; transition: 0.1s; }
        .music-toggle:active { transform: translateY(6px); box-shadow: 0 0 0 #ff8f00; }
        
        .progress-container { width: 100%; height: 20px; background: #ffffff; border-radius: 10px; overflow: hidden; border: 4px solid #1565c0; box-shadow: inset 0 3px 6px rgba(0,0,0,0.2); margin: 0 30px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #64b5f6, #1e88e5); width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 5px; }

        .level-nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 5px; padding: 8px; }
        .level-btn { 
            border: 3px solid white; border-radius: 50%; width: 50px; height: 50px; 
            background-color: #90caf9; color: #0d47a1; font-weight: bold; font-size: 1.4rem; 
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; 
            align-items: center; box-shadow: 0 6px 0 #42a5f5; 
        }
        .level-btn.active { transform: scale(1.15); border: 4px solid white; background-color: #1e88e5; color: white; box-shadow: 0 6px 0 #1565c0; z-index: 10; }

        .game-area { 
            background: #ffffff; border-radius: 40px; padding: 15px; flex-grow: 1;
            box-shadow: inset 0 0 0 8px #e3f2fd; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; 
            position: relative; overflow: hidden;
        }
        
        .btn-speaker { background: #ff9800; border: none; font-size: 4rem; border-radius: 50%; width: 90px; height: 90px; cursor: pointer; color: white; box-shadow: 0 8px 0 #f57c00, 0 15px 25px rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:center; transition: 0.1s; position: absolute; top: 20px; left: 30px; z-index: 50; }
        .btn-speaker:active { transform: scale(0.9) translateY(8px); box-shadow: 0 0 0 #f57c00; }

        .btn-accion { font-size: 2.2rem; padding: 15px 40px; border-radius: 60px; border: none; background: #ff9800; font-weight: bold; box-shadow: 0 8px 0 #f57c00; cursor: pointer; color: white; transition: 0.1s; text-align: center; display:flex; align-items:center; justify-content:center; gap: 10px;}
        .btn-accion:active { transform: translateY(8px); box-shadow: 0 0 0 #f57c00; }
        
        .error-x { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18rem; color: #f44336; font-weight: bold; text-shadow: 0 0 40px white; pointer-events: none; animation: fadeX 0.8s ease-out forwards; z-index: 20; }
        @keyframes fadeX { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }
        
        .anim-bounce { animation: slowBounce 2.5s infinite ease-in-out; }
        @keyframes slowBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .drop-zone { min-height: 250px; width: 100%; max-width: 450px; border-radius: 50px; padding: 15px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; border: 12px dashed #1e88e5; background: #e3f2fd; position: relative; overflow: hidden; transition: 0.2s;}
        .drop-zone.highlight { transform: scale(1.05); border-color: #ff9800; background: #fff3e0; }
        
        .draggable-item { border-radius: 20px; cursor: grab; display: flex; justify-content: center; align-items: center; margin: 10px; background: white; border: 6px solid #1e88e5; box-shadow: 0 10px 20px rgba(0,0,0,0.2); padding: 5px; overflow: hidden; font-size: 3rem; font-weight:bold; color: #0d47a1; text-align:center; z-index: 10;}
        .draggable-item img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; pointer-events: none; display: block; margin: auto;}
        .draggable-item:active { cursor: grabbing; transform: scale(1.15); z-index: 1000;}
        .draggable-item.dragging { opacity: 0.8; z-index: 1000; }

        .price-tag { background:#ff9800; color:white; font-size:3.5rem; font-weight:bold; padding:10px 30px; border-radius:20px; border:6px solid #e65100; box-shadow: 0 8px 15px rgba(0,0,0,0.3); text-align:center; margin-top: 15px;}
        
        .memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 900px; width: 100%; padding: 10px; }
        .memory-card { height: 220px; background: #42a5f5; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 0 #1565c0; border: 8px solid #ffffff; overflow: hidden; padding: 15px; box-sizing: border-box; transition: transform 0.2s; font-size: 5rem; font-weight:bold; color:#0d47a1; text-align:center;}
        .memory-card:active { transform: scale(0.9); }
        .memory-card.flipped { background: white; box-shadow: 0 4px 0 #1565c0; transform: scale(0.95); }
        .memory-card.matched { opacity: 0; pointer-events: none; transform: scale(0.4); transition: 0.4s; }
        .memory-card img { width: 100%; height: 100%; object-fit: contain; border-radius: 15px; display: none; margin: auto;}
        .memory-card.flipped img { display: block; }
        .memory-card.flipped .text-content { display: block; }
        .text-content { display: none; }

        .puzzle-board { display: grid; grid-template-columns: 250px 250px; grid-template-rows: 250px 250px; gap: 8px; background: rgba(255,255,255,0.9); padding: 20px; border-radius: 50px; border: 12px solid #1e88e5; box-shadow: 0 25px 50px rgba(0,0,0,0.25); transition: gap 0.5s; }
        .puzzle-slot { width: 100%; height: 100%; border: 6px dashed #42a5f5; border-radius: 20px; background-color: #e3f2fd; transition: 0.2s; }
        .puzzle-slot.highlight { background-color: #fff3e0; border-color: #ff9800; transform: scale(1.02); }
        .puzzle-piece-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 520px; }
        .puzzle-piece { width: 250px; height: 250px; background-size: 500px 500px; border-radius: 30px; cursor: grab; box-shadow: 0 15px 30px rgba(0,0,0,0.3); border: 8px solid #ff9800; background-color: white; background-repeat: no-repeat;}
        .puzzle-piece:active { cursor: grabbing; transform: scale(1.1); z-index: 1000; }

        .confetti-container { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 9999; overflow: hidden; }
        .firework-particle { position: absolute; border-radius: 50%; animation: burst 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes burst { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
        .star-burst { position: fixed; font-size: 6rem; animation: fly 1.5s ease-out forwards; pointer-events: none; z-index: 10000; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); }
        @keyframes fly { 0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; } 100% { transform: translateY(-250px) scale(2.5) rotate(720deg); opacity: 0; } }
        
        .final-box { background: white; border-radius: 60px; text-align: center; border: 15px double #1e88e5; max-width: 1000px; width: 100%; box-shadow: 0 30px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .diploma-preview { background: #e3f2fd; border: 8px solid #1e88e5; border-radius: 40px; margin: 15px 0; width: 100%; padding: 20px;}

        /* Estilos Hoja de Calculo / Boleta */
        .calc-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; font-size: 1.5rem; text-align: center;}
        .calc-table th { background: #1e88e5; color: white; padding: 15px; font-weight: bold; border-radius: 10px; }
        .calc-table td { background: #f5f5f5; padding: 10px; border-bottom: 3px solid #e0e0e0; font-weight: bold; color: #424242;}
        .calc-select { font-size: 1.2rem; padding: 10px; border-radius: 15px; border: 4px solid #1e88e5; background: white; color: #0d47a1; font-weight: bold; width: 100%; cursor: pointer;}
        .qty-btn { font-size: 1.8rem; width: 40px; height: 40px; border-radius: 50%; border: none; background: #ff9800; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #f57c00; transition: 0.1s;}
        .qty-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #f57c00; }
        .qty-display { display: inline-block; width: 50px; text-align: center; font-size: 1.8rem; background: white; border: 3px solid #ccc; border-radius: 10px; padding: 2px; margin: 0 10px; }
        
        .client-input { font-size: 1.5rem; padding: 10px; width: 80%; max-width: 500px; border: 4px solid #1e88e5; border-radius: 20px; text-align: center; margin-bottom: 10px; outline: none;}
        
        /* Contenedor de Video Fijo */
        .tv-frame { border: 15px solid #333; border-radius: 30px; background: black; padding: 5px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 850px; aspect-ratio: 16/9; position: relative; }
        .tv-frame video { width: 100%; height: 100%; border-radius: 15px; outline: none; }
        
        /* ==================== ESTILOS PARA IMPRIMIR BOLETA ==================== */
        @media print {
            .no-print { display: none !important; }
            body, html { background: white !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; height: auto !important; }
            .game-container { display: none !important; }
            
            #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; font-family: 'Courier New', Courier, monospace; padding: 20px; }
            .boleta-print { width: 80mm; margin: 0 auto; padding: 10px; border: 2px dashed #000; }
            .boleta-print h2 { text-align: center; font-size: 1.5rem; margin-bottom: 5px; }
            .boleta-print p { text-align: center; font-size: 1rem; margin: 2px 0; }
            .boleta-print .line { border-bottom: 1px dashed #000; margin: 10px 0; }
            .boleta-table { width: 100%; font-size: 1rem; text-align: left; border-collapse: collapse; }
            .boleta-table th { border-bottom: 1px solid #000; padding-bottom: 5px; }
            .boleta-table td { padding: 5px 0; }
            .boleta-total { font-size: 1.2rem; font-weight: bold; text-align: right; margin-top: 10px; }
        }
        #printArea { display: none; }
    </style>
</head>
<body>
<!-- Área exclusiva para imprimir la boleta -->
<div id="printArea"></div>
<div id="blockerOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: transparent; z-index: 99999; display: none; pointer-events: none;"></div>

<!-- Etiqueta de audio -->
<audio id="bgMusic" src="https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg" loop></audio>

<div class="game-container no-print">
    <div class="top-bar">
        <div class="cebe-title-container">
            <div class="cebe-logo-circle">CEBE</div>
            <div class="cebe-title-text">REGISTRAMOS NUESTRAS VENTAS</div>
        </div>
        <div class="right-controls">
            <div class="student-name" id="studentNameDisplay">🌟</div>
            <button class="music-toggle" id="musicToggleBtn">🎵</button>
        </div>
    </div>
    
    <div class="progress-container">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="level-nav" id="levelNav"></div>
    <div class="game-area" id="gameArea"></div>
</div>

<script>
    const TOTAL_NIVELES = 16; 
    let currentLevel = 0;
    let playerName = "";
    let musicEnabled = true;
    let gameInterval = null; 
    let spawnInterval = null; 
    let nivelSuperado = false; 
    let speakTimeout = null; 
    let textoInstruccionActual = ""; 
    
    // NOMBRES EXACTOS DE LAS IMÁGENES SEGÚN LO SUBIDO
    const imgBurger = ["1_2_2.jpg", "1_2.jpg"];           
    const imgMazamorra = ["2_2_2.jpg", "2_2.jpg"];        
    const imgMuffin = ["3_2_2.jpg", "3_2.jpg"];           
    const imgPapaHuevo = ["4_2_2.jpg", "4_2.jpg", "maxresdefault.jpg"]; 
    const imgArrozLeche = ["5_2_2.jpg", "5_2.jpg"];       
    const imgPollo = ["6_2_2.jpg", "6_2.jpg"];            
    const imgChocoteja = ["images_3.jpg"];     
    const imgPopcorn = ["7867876-bag-of-kettle-corn-or-bag-of-popcorn.jpg"]; 
    const imgBurgerRoyal = ["2146463856_1.jpg"]; 
    const imgCuy = ["000258537M-1.jpg"];       
    const imgCajaReg = ["images.jpg"];         
    const imgCajaFuerte = ["120105.jpg"];      
    const imgSol1 = ["7_2_2.jpg", "7_2.jpg"];             
    const imgSol2 = ["8_2_2.jpg", "8_2.jpg"];             
    const imgSol5 = ["9_2_2.jpg", "9_2.jpg"];             
    const imgSol10 = ["10_2.jpg", "10.jpg"];             
    const imgBillete20 = ["11.jpg"];           

    // NOMBRES EXACTOS DE LOS VIDEOS
    const video1 = "El negocio propio I Cuentos Infantiles I Narración I Yo Me Cuido.mp4";
    const video2 = "Las TIENDAS para niños - De compras por la ciudad - Vocabulario para niños.mp4";

    // Script para fallback automático si la imagen tiene otro nombre
    window.fallbackImage = function(imgEl) {
        let srcsStr = imgEl.getAttribute('data-srcs');
        if(!srcsStr) return;
        let srcs = JSON.parse(srcsStr);
        let idx = parseInt(imgEl.getAttribute('data-idx')) + 1;
        if (idx < srcs.length) {
            imgEl.setAttribute('data-idx', idx);
            imgEl.src = encodeURI(srcs[idx]);
        } else {
            imgEl.onerror = null;
            imgEl.src = 'https://via.placeholder.com/450/ffcdd2/b71c1c?text=Falta+Foto:+' + encodeURIComponent(srcs[0]);
        }
    };

    function crearImagen(srcOptions) {
        let srcsStr = JSON.stringify(srcOptions).replace(/"/g, '&quot;');
        return `<img src="${encodeURI(srcOptions[0])}" data-srcs="${srcsStr}" data-idx="0" onerror="window.fallbackImage(this)" style="width:100%; height:100%; object-fit:contain; border-radius:inherit; pointer-events:none; display:block;">`;
    }

    const gameArea = document.getElementById('gameArea');
    const studentNameSpan = document.getElementById('studentNameDisplay');
    const levelNav = document.getElementById('levelNav');
    const progressFill = document.getElementById('progressFill');

    document.addEventListener('contextmenu', e => e.preventDefault());

    function activarBloqueoSeguridad() {
        document.getElementById('blockerOverlay').style.display = 'block';
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
    }

    function speakMessage(text, callback, saveHint = false) {
        if (!text) return;
        if (saveHint) textoInstruccionActual = text;
        if (speakTimeout) { clearTimeout(speakTimeout); speakTimeout = null; }
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel(); 
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX'; utterance.rate = 0.85; utterance.pitch = 1.15;   
                const voices = window.speechSynthesis.getVoices();
                const isSpain = (v) => v.lang === 'es-ES' || v.lang === 'es_ES' || v.name.includes('España') || v.name.includes('Spain');
                const latinVoices = voices.filter(v => v.lang.startsWith('es') && !isSpain(v));
                
                let voice = latinVoices.find(v => v.name.includes('Sabina') || v.name.includes('Paulina')) 
                         || latinVoices[0] || voices.find(v => v.lang === 'es-MX'); 
                         
                if(voice) utterance.voice = voice;
                window.speechSynthesis.speak(utterance);
            }, 250); 
        }
        if (callback) {
            let delay = Math.max(3000, text.length * 115) + 250; 
            speakTimeout = setTimeout(callback, delay);
        }
    }

    function crearFuegosArtificiales() {
        const container = document.createElement('div'); container.className = 'confetti-container no-print';
        document.body.appendChild(container);
        const colors = ['#1e88e5', '#ffca28', '#4caf50', '#ff9800', '#e91e63'];
        for(let j=0; j<4; j++) {
            const baseX = 15 + Math.random() * 70; const baseY = 15 + Math.random() * 60; 
            for(let i=0; i<40; i++){
                const el = document.createElement('div'); el.className = 'firework-particle';
                const size = Math.random() * 20 + 10;
                const tx = (Math.random() - 0.5) * 600; const ty = (Math.random() - 0.5) * 600; 
                el.style.cssText = `left:${baseX}vw; top:${baseY}vh; width:${size}px; height:${size}px; background:${colors[Math.floor(Math.random()*colors.length)]}; box-shadow: 0 0 10px ${colors[Math.floor(Math.random()*colors.length)]};`;
                el.style.setProperty('--tx', `${tx}px`); el.style.setProperty('--ty', `${ty}px`);
                container.appendChild(el);
            }
        }
        setTimeout(()=>container.remove(), 1600);
    }

    function crearEstrellas() {
        for(let i=0;i<10;i++){
            const star = document.createElement('div'); star.innerHTML = '⭐'; star.className = 'star-burst no-print';
            star.style.left = (Math.random()*100) + 'vw'; star.style.top = '80vh';
            document.body.appendChild(star);
            setTimeout(()=>star.remove(), 1200);
        }
    }

    function refuerzoPositivo(mensaje, callback) {
        crearFuegosArtificiales(); crearEstrellas();
        speakMessage(mensaje || "¡Excelente trabajo!", callback);
    }

    window.mostrarError = function(elemento) {
        if(!elemento) return;
        speakMessage("Uy, inténtalo de nuevo.");
        const x = document.createElement('div'); x.className = 'error-x no-print'; x.textContent = '✖';
        elemento.appendChild(x);
        setTimeout(() => { if (x.parentNode) x.remove(); }, 800);
    }

    function initAudio() {
        let audioEl = document.getElementById('bgMusic');
        if(audioEl) {
            audioEl.volume = 0.05; 
            let playPromise = audioEl.play();
            if (playPromise !== undefined) { playPromise.catch(error => { console.log("Audio bloqueado."); }); }
        }
    }

    function toggleMusic() {
        musicEnabled = !musicEnabled;
        document.getElementById('musicToggleBtn').textContent = musicEnabled ? '🎵' : '🔇';
        let audioEl = document.getElementById('bgMusic');
        if (musicEnabled && audioEl && audioEl.paused) { 
            audioEl.play().catch(e => console.log(e));
        } else if (!musicEnabled && audioEl) {
            audioEl.pause();
        }
    }
    document.getElementById('musicToggleBtn').addEventListener('click', toggleMusic);

    function actualizarBotonesNiveles() {
        levelNav.innerHTML = '';
        for(let i=1; i<=TOTAL_NIVELES; i++) {
            const btn = document.createElement('button'); 
            btn.className = 'level-btn no-print';
            
            if (i === 14) { btn.textContent = '🧾'; btn.title = "Caja Registradora"; }
            else if (i === 15) { btn.textContent = '🎬'; btn.title = "Videos"; }
            else if (i === 16) { btn.textContent = '🎓'; btn.title = "Diploma"; }
            else { btn.textContent = i; }

            if(i === currentLevel) btn.classList.add('active');
            
            btn.addEventListener('click', () => {
                if(gameInterval) clearInterval(gameInterval); if(spawnInterval) clearInterval(spawnInterval);
                if(speakTimeout) clearTimeout(speakTimeout); window.speechSynthesis.cancel(); 
                irANivel(i);
            });
            levelNav.appendChild(btn);
        }
        let prog = (currentLevel / TOTAL_NIVELES) * 100;
        progressFill.style.width = prog + '%';
    }

    function irANivel(n) {
        if(n < 1 || n > TOTAL_NIVELES) return;
        currentLevel = n; nivelSuperado = false; 
        
        // Reanudar música si salimos de la videoteca
        if (n !== 15 && musicEnabled) {
            let audioEl = document.getElementById('bgMusic');
            if(audioEl && audioEl.paused) audioEl.play().catch(e=>{});
        }

        actualizarBotonesNiveles();
        const niveles = [ 
            nivel1, nivel2, nivel3, nivel4, nivel5, nivel6, nivel7, nivel8, 
            nivel9, nivel10, nivel11, nivel12, nivel13, nivel14, nivel15, mostrarFinal 
        ];
        niveles[n-1]();
    }

    window.completarNivelActual = function(mensajePersonalizado) {
        if(nivelSuperado) return; 
        nivelSuperado = true; 
        if(currentLevel > 0 && currentLevel <= TOTAL_NIVELES) {
            if(currentLevel === TOTAL_NIVELES) { 
                mostrarFinal(); 
            } else { 
                let next = currentLevel + 1; 
                refuerzoPositivo(mensajePersonalizado, () => { irANivel(next); }); 
            }
        }
    }

    function agregarBotonParlante() {
        const btn = document.createElement('button'); btn.className = 'btn-speaker no-print'; btn.innerHTML = '🔊';
        btn.onclick = () => { 
            btn.style.pointerEvents = 'none'; 
            setTimeout(() => btn.style.pointerEvents = 'auto', 1000); 
            speakMessage(textoInstruccionActual, null, false); 
        };

    function configurarMemoria(paresRaw, msjFinal) {
        let cartas = paresRaw.sort(() => Math.random() - 0.5);
        let abiertas = []; let emparejadas = 0;
        let grid = document.createElement('div'); grid.className = 'memory-grid';
        if(paresRaw.length === 4) { grid.style.gridTemplateColumns = 'repeat(2, 1fr)'; grid.style.maxWidth = '600px'; }
        cartas.forEach((item) => {
            let card = document.createElement('div'); card.className = 'memory-card';
            card.innerHTML = `<div class="card-back" style="font-size:8rem; color:white; text-shadow:0 5px 0 #1565c0;">S/</div><div class="card-front" style="display:none; width:100%; height:100%; padding:0; justify-content:center; align-items:center;">${item.html}</div>`;
            card.onclick = () => {
                if (card.classList.contains('flipped') || card.classList.contains('matched') || abiertas.length === 2) return;
                card.classList.add('flipped');
                card.querySelector('.card-back').style.display = 'none'; card.querySelector('.card-front').style.display = 'flex';
                abiertas.push({ id: item.id, elem: card });
                if (abiertas.length === 2) {
                    setTimeout(() => {
                        if (abiertas[0].id === abiertas[1].id) { 
                            abiertas[0].elem.classList.add('matched'); abiertas[1].elem.classList.add('matched'); 
                            emparejadas += 2;
                            if (emparejadas === paresRaw.length) completarNivelActual(msjFinal);
                        } else { 
                            abiertas[0].elem.classList.remove('flipped'); abiertas[0].elem.querySelector('.card-back').style.display = 'block'; abiertas[0].elem.querySelector('.card-front').style.display = 'none';
                            abiertas[1].elem.classList.remove('flipped'); abiertas[1].elem.querySelector('.card-back').style.display = 'block'; abiertas[1].elem.querySelector('.card-front').style.display = 'none';
                        }
                        abiertas = [];
                    }, 1000);
                }
            };
            grid.appendChild(card);
        });
        gameArea.appendChild(grid);
    }

    function configurarRompecabezas(imgSource, msjFinal) {
        let html = `<div style="display:flex; justify-content:space-around; align-items:center; width:100%; height:100%; padding:10px;">`;
        html += `<div class="puzzle-piece-container" id="piecesContainer"></div>`;
        html += `<div class="puzzle-board">`;
        for(let i=0; i<4; i++) { html += `<div class="puzzle-slot" id="slot_${i}" data-index="${i}"></div>`; }
        html += `</div></div>`;
        gameArea.innerHTML += html;
        
        const positions = ['0px 0px', '-250px 0px', '0px -250px', '-250px -250px'];
        let order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
        let piecesContainer = document.getElementById('piecesContainer');
        
        order.forEach(idx => {
            let piece = document.createElement('div'); piece.className = 'puzzle-piece'; piece.id = `piece_${idx}`; piece.draggable = true;
            piece.style.backgroundImage = `url('${encodeURI(imgSource[0])}')`; 
            piece.style.backgroundPosition = positions[idx];
            piece.ondragstart = (e) => { e.dataTransfer.setData('text/plain', idx); piece.style.opacity = '0.5'; };
            piece.ondragend = () => { piece.style.opacity = '1'; };
            piecesContainer.appendChild(piece);
        });
        
        let placedCount = 0;
        for(let i=0; i<4; i++) {
            let slot = document.getElementById(`slot_${i}`);
            if(!slot) continue;
            slot.ondragover = (e) => { e.preventDefault(); slot.classList.add('highlight'); };
            slot.ondragleave = () => { slot.classList.remove('highlight'); };
            slot.ondrop = (e) => {
                e.preventDefault(); slot.classList.remove('highlight');
                let draggedIdx = e.dataTransfer.getData('text/plain');
                if (draggedIdx == i) { 
                    let piece = document.getElementById(`piece_${draggedIdx}`); if(piece) piece.style.display = 'none'; 
                    slot.style.backgroundImage = `url('${encodeURI(imgSource[0])}')`; slot.style.backgroundSize = "500px 500px"; slot.style.backgroundPosition = positions[i];
                    slot.style.border = 'none'; slot.style.borderRadius = '0';
                    if(i===0) slot.style.borderTopLeftRadius = '20px'; if(i===1) slot.style.borderTopRightRadius = '20px';
                    if(i===2) slot.style.borderBottomLeftRadius = '20px'; if(i===3) slot.style.borderBottomRightRadius = '20px';
                    placedCount++;
                    if (placedCount === 4) {
                        let pb = document.querySelector('.puzzle-board');
                        if(pb) pb.style.gap = '0px'; 
                        completarNivelActual(msjFinal);
                    }
                } else { mostrarError(slot); }
            };
        }
    }

            <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin:30px 0; flex-wrap:wrap;">
                <div class="anim-bounce" style="width:230px; height:230px; border-radius:40px; border:8px solid #1e88e5; box-shadow:0 10px 25px rgba(0,0,0,0.2); background: white; padding: 15px; box-sizing: border-box; display:flex; justify-content:center; align-items:center;">${crearImagen(imgBurgerRoyal)}</div>
                <div class="anim-bounce" style="width:230px; height:230px; border-radius:40px; border:8px solid #ff9800; box-shadow:0 10px 25px rgba(0,0,0,0.2); animation-delay: 0.3s; background: white; padding: 15px; box-sizing: border-box; display:flex; justify-content:center; align-items:center;"><div style="font-size:8rem;">📠</div></div>
                <div class="anim-bounce" style="width:230px; height:230px; border-radius:40px; border:8px solid #1e88e5; box-shadow:0 10px 25px rgba(0,0,0,0.2); animation-delay: 0.6s; background: white; padding: 15px; box-sizing: border-box; display:flex; justify-content:center; align-items:center;">${crearImagen(imgCuy)}</div>
            </div>

            <input type="text" id="nameInput" placeholder="¿Cómo te llamas?" style="font-size:3.5rem; padding:20px 40px; border-radius:60px; border:8px solid #ff9800; text-align:center; max-width:700px; width:90%; outline:none; box-shadow:inset 0 5px 15px rgba(0,0,0,0.1);">
            
            <div style="display:flex; justify-content:center; width:100%; margin-top:35px;">
                <button class="btn-accion" id="startBtn">ENTRAR A LA TIENDA 🚀</button>
            </div>
        </div>`;
        gameArea.innerHTML = html;
        let startBtn = document.getElementById('startBtn');
        if(startBtn) startBtn.addEventListener('click', iniciarJuegoAction);
        let nameInput = document.getElementById('nameInput');
        if(nameInput) {
            nameInput.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') iniciarJuegoAction();
            });
        }
        if(progressFill) progressFill.style.width = '0%';
    }

    window.onload = function() { mostrarIntro(); };
</script>
